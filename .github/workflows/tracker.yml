name: GitHub Projects Automation

on:
  pull_request:
    types: [closed]

jobs:
  move-issue-to-done:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Check for merge and find linked issue
        if: github.event.pull_request.merged == true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "PR merged. Linked issue: #$ISSUE will be moved to Done"
