name: CI Workflow - Docker

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v2

      - name: Build Docker image
        run: docker build -t task-manager:latest .

      - name: Run Docker image
        run: docker run --rm -v "$PWD":/app -e GITHUB_USER="${{ github.actor }}" task-manager:latest

      - name: Fix file ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CI: update index.html" || echo "No changes"
          git push origin HEAD:main
